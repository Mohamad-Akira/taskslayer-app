name: Build iOS App with Capacitor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath "$PWD/build/App.xcarchive" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Create Unsigned IPA Package
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TaskSlayer.ipa Payload
          zip -r App.xcarchive.zip App.xcarchive

      - name: Upload iOS App (IPA & Archive)
        uses: actions/upload-artifact@v4
        with:
          name: TaskSlayer-iOS-Package
          path: |
            ios/App/build/TaskSlayer.ipa
            ios/App/build/App.xcarchive.zip
          retention-days: 7
